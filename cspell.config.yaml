version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
  # El sitio KUROGANE está en español con vocabulario japonés: otro diccionario,
  # otro subproyecto. Se valida con tools/audit.mjs, no con este corrector.
  - site/**
  - tools/**
words:
  - Decap
  - hostnames
  - jsdoc
  - singleline
  - Sveltia
