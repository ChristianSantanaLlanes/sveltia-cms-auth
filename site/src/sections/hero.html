<section id="hero" class="section--dark" aria-labelledby="hero-title">
  <div class="hero__figure">
    <picture>
      <source type="image/avif" sizes="(min-width: 900px) 46vw, 80vw"
        srcset="/assets/img/hero-tall-640.avif 640w, /assets/img/hero-tall-960.avif 960w, /assets/img/hero-tall-1280.avif 1280w">
      <source type="image/webp" sizes="(min-width: 900px) 46vw, 80vw"
        srcset="/assets/img/hero-tall-640.webp 640w, /assets/img/hero-tall-960.webp 960w, /assets/img/hero-tall-1280.webp 1280w">
      <img src="/assets/img/hero-tall-1280.jpg" width="1280" height="1707"
        alt="Hoja de katana sobre fondo negro: el hamon ondulado recorre todo el filo, con el grabado del ken y la espiga firmada por el forjador."
        fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="hero__light" aria-hidden="true"></div>

  <div class="hero__inner wrap">
    <p class="eyebrow hero__eyebrow">Taller Kurogane — Seki, Gifu</p>
    <h1 class="hero__title" id="hero-title">Acero que recuerda el fuego.</h1>
    <p class="lede hero__lede">Cada hoja nace de una sola barra de tamahagane: plegada a mano, templada en arcilla y montada a la medida de tu mano.</p>

    <div class="hero__actions">
      <a class="btn btn--lg" href="#configurador">Configurar la tuya</a>
      <a class="btn btn--lg btn--glass" href="#catalogo">Ver el catálogo</a>
    </div>

    <dl class="hero__facts">
      <div class="hero__fact">
        <dt>Acero</dt>
        <dd>Tamahagane</dd>
      </div>
      <div class="hero__fact">
        <dt>Temple</dt>
        <dd>En arcilla</dd>
      </div>
      <div class="hero__fact">
        <dt>Forja</dt>
        <dd>6–14 semanas</dd>
      </div>
    </dl>
  </div>
</section>
